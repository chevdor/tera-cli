<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tera-cli</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Command-line interface for the tera template engine." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <!-- docsify-themeable: dark by default, light on toggle -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css" id="theme-dark" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css" id="theme-light" disabled />
  <style>
    :root {
      /* Per-project accent — change these two-ish values, keep everything else. */
      --theme-color: #d97706;
      --link-color: #d97706;
      --link-color--hover: #fbbf24;
      --base-font-size: 16px;
      --content-max-width: 46rem;
    }
    /* Floating dark/light toggle (top-right). */
    .theme-toggle {
      position: fixed; top: 10px; right: 10px; width: 40px; height: 40px;
      border-radius: 50%; border: 2px solid var(--theme-color);
      background: transparent; cursor: pointer; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; transition: transform 0.3s ease;
    }
    .theme-toggle:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'tera-cli',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      coverpage: false,
      executeScript: true,   // needed for embeds (asciinema, etc.)
      mergeNavbar: true,
      alias: {
        // Always fall back to the single root sidebar on any subpage.
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      themeable: { readyTransition: true, responsiveTables: true },
      search: {
        placeholder: 'Search the docs…',
        noData: 'No results.',
        depth: 3
      }
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Themeable plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Search + copy-to-clipboard -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Prism languages (add more as needed) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <!-- Mermaid (optional — drop if the docs have no diagrams) -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true });
    window.mermaid = mermaid;
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>

  <!-- Dark/light theme toggle (default dark, persisted). -->
  <script>
    (function () {
      const KEY = 'docsify-theme';
      const dark = document.getElementById('theme-dark');
      const light = document.getElementById('theme-light');
      const btn = document.createElement('button');
      btn.className = 'theme-toggle';
      btn.setAttribute('aria-label', 'Toggle theme');
      function set(isDark) {
        dark.disabled = !isDark;
        light.disabled = isDark;
        btn.innerHTML = isDark ? '☀️' : '🌙';
        localStorage.setItem(KEY, isDark ? 'dark' : 'light');
      }
      set(localStorage.getItem(KEY) !== 'light');
      btn.addEventListener('click', () => set(dark.disabled));
      window.addEventListener('load', () => document.body.appendChild(btn));
    })();
  </script>
</body>
</html>
